# Daily at 06:00 WIB (23:00 UTC): fetch yesterday's prices, rebuild data/processed/,
# commit the new raw and processed files, then publish the page to GitHub Pages.
# A push to main only republishes the page (no fetch).
name: Update data and publish

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      # fetch.py skips files it already has, so a second pass only retries the failed requests
      - name: Fetch
        run: python fetch.py --days 1 || (sleep 60 && python fetch.py --days 1)
      # build.py validates first and leaves data/processed/ untouched if anything is wrong
      - name: Build data
        run: python build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../data
          git diff --cached --quiet && echo "No new data." && exit 0
          git commit -m "data: update $(TZ=Asia/Jakarta date +%F)"
          git push

  publish:
    needs: update
    # runs after a successful update, or on a push (where update is skipped)
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the data commit made by the update job
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
